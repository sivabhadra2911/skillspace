<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7fa" />
    <meta
      name="description"
      content="Skill Space connects freelancers and recruiters through meaningful opportunities, planning tools, and community."
    />
    <title>Skill Space — Your work, in motion</title>
    <script>
      try {
        const saved = localStorage.getItem("skillspace_theme");
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
